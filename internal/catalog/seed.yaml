# Default Hamazon catalog, loaded on the very first start only. Existing
# shops pick up new entries through "Add missing defaults" in the admin area.
#
# Not included: creative only items, unique items like the dragon egg,
# items whose identity lives in components (potions, written books, maps,
# firework stars), waxed copper (wax it with honeycomb), and anything that
# is or turns into a currency (diamonds, emeralds, gold and their ores).
#
# Prices are per purchase unit (count items). Rough baseline used while
# balancing: 1 diamond is worth about 4 emeralds or 8 gold ingots, but the
# shop never converts between currencies, every price is paid as listed.
#
# playerLimit + playerLimitDays cap how many units one player can order
# within a rolling window, on top of maxPerOrder.

currencies:
  - { id: diamond, name: Diamond, texture: diamond }
  - { id: emerald, name: Emerald, texture: emerald }
  - { id: gold_ingot, name: Gold Ingot, texture: gold_ingot }

